
# This workflow will install Python dependencies, run tests and report code coverage with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: pytests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: metacoadd
          environment-file: environment.yml
          generate-run-shell: true
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      - name: Run tests with Numba JIT enabled
        shell: micromamba-shell {0}
        run: pytest -vvv tests/metacoadd

  shear-tests:
    name: Shear test - ${{ matrix.model }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        model: ["wmom", "pgauss", "gam", "gauss"]

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: metacoadd
          environment-file: environment.yml
          generate-run-shell: true
          create-args: >-
            python=3.14

      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      - name: Run shear test
        shell: micromamba-shell {0}
        run: |
          pytest -vvs \
            "tests/shear_meas/test_shear_meas_mdet.py::test_shear_meas_simple[${{ matrix.model }}-1000000.0-7-64]"

  coverage:
    name: Coverage - Python 3.14
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: metacoadd
          environment-file: environment.yml
          generate-run-shell: true
          create-args: >-
            python=3.14

      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[dev]"

      - name: Run code coverage
        shell: micromamba-shell {0}
        run: bash tests/metacoadd/run_tests.sh

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false